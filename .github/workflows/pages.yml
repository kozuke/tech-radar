# Tech Radar - GitHub Pages デプロイワークフロー
# data/またはsite/が更新されたらサイトをビルド・デプロイする

name: Deploy to GitHub Pages

on:
  # data/またはsite/が更新されたらトリガー
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'data/**'
      - 'scripts/**'
      - 'package.json'

  # collect.ymlが完了した時にトリガー
  workflow_run:
    workflows: ["Collect Articles"]
    types:
      - completed
    branches:
      - main

  # 手動実行
  workflow_dispatch:

# GitHub Pagesへのデプロイ権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行の制御（具体的なグループ名で競合を回避）
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_deploy: ${{ steps.detect.outputs.should_deploy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect deployable changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$WORKFLOW_RUN_HEAD_SHA" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::workflow_run head SHA is empty; skipping deploy"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$WORKFLOW_RUN_HEAD_SHA"..HEAD -- data site)
          if [ -z "$CHANGED_FILES" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No deployable changes detected in data/ or site/"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployable changes detected:"
            echo "$CHANGED_FILES"
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # workflow_runでトリガーされた場合は、元のワークフローが成功した場合のみ実行
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.should_deploy == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    outputs:
      slack_summary: ${{ steps.extract_summary.outputs.summary }}
      latest_digest_date: ${{ steps.extract_summary.outputs.date }}
      digest_page_path: ${{ steps.verify_digest_page.outputs.path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Extract Slack summary from latest digest
        id: extract_summary
        run: |
          # JSTの当日ダイジェストを優先し、存在しない場合はファイル名の日付順で最新を取得
          TODAY_JST=$(TZ=Asia/Tokyo date +'%Y-%m-%d')
          TODAY_DIGEST="data/items/${TODAY_JST}__daily-digest.md"

          if [ -f "$TODAY_DIGEST" ]; then
            LATEST_DIGEST="$TODAY_DIGEST"
          else
            LATEST_DIGEST=$(find data/items -maxdepth 1 -type f -name '*__daily-digest.md' 2>/dev/null | sort | tail -1)
          fi

          echo "Selected digest: ${LATEST_DIGEST:-none}"
          
          if [ -n "$LATEST_DIGEST" ] && [ -f "$LATEST_DIGEST" ]; then
            # ファイル名から日付を抽出
            DATE=$(basename "$LATEST_DIGEST" | sed 's/__daily-digest.md//')
            echo "date=$DATE" >> $GITHUB_OUTPUT
            
            # SLACK_SUMMARY_START と SLACK_SUMMARY_END の間を抽出
            SUMMARY=$(sed -n '/<!-- SLACK_SUMMARY_START -->/,/<!-- SLACK_SUMMARY_END -->/p' "$LATEST_DIGEST" | \
                      sed '1d;$d' | \
                      tr '\n' '\\n' | \
                      sed 's/\\n$//')
            
            if [ -n "$SUMMARY" ]; then
              # GitHub Actions outputに設定（改行をエスケープ）
              echo "summary<<EOF" >> $GITHUB_OUTPUT
              sed -n '/<!-- SLACK_SUMMARY_START -->/,/<!-- SLACK_SUMMARY_END -->/p' "$LATEST_DIGEST" | sed '1d;$d' >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            else
              echo "summary=新しい記事が追加されました。詳細はサイトでご確認ください。" >> $GITHUB_OUTPUT
            fi
          else
            echo "date=" >> $GITHUB_OUTPUT
            echo "summary=サイトが更新されました。" >> $GITHUB_OUTPUT
          fi

      - name: Build site
        run: npm run build

      - name: Verify digest detail page
        id: verify_digest_page
        run: |
          DIGEST_DATE="${{ steps.extract_summary.outputs.date }}"
          COPIED_COUNT=$(find site/articles -maxdepth 1 -type f -name '*__daily-digest.md' 2>/dev/null | wc -l | tr -d ' ')
          GENERATED_COUNT=$(find site/.vitepress/dist/articles -maxdepth 1 -type f -name '*__daily-digest.html' 2>/dev/null | wc -l | tr -d ' ')

          echo "Copied digest markdown pages: $COPIED_COUNT"
          echo "Generated digest HTML pages: $GENERATED_COUNT"

          if [ "$COPIED_COUNT" -gt 0 ] && [ "$GENERATED_COUNT" -eq 0 ]; then
            echo "::error::No digest detail pages were generated under site/.vitepress/dist/articles"
            exit 1
          fi

          if [ -z "$DIGEST_DATE" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DIGEST_PAGE_PATH="articles/${DIGEST_DATE}__daily-digest.html"
          if [ -f "site/.vitepress/dist/$DIGEST_PAGE_PATH" ]; then
            echo "path=$DIGEST_PAGE_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Digest detail page was not generated: $DIGEST_PAGE_PATH"
            echo "Generated article pages:"
            find site/.vitepress/dist/articles -maxdepth 1 -type f -name '*__daily-digest.html' -print 2>/dev/null | sort || true
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 10
          reporting_interval: 5000

      - name: Notify Slack
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_SUMMARY: ${{ needs.build.outputs.slack_summary }}
          DIGEST_DATE: ${{ needs.build.outputs.latest_digest_date }}
          DIGEST_PAGE_PATH: ${{ needs.build.outputs.digest_page_path }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          # Webhook URLが設定されていない場合はスキップ
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not set, skipping notification"
            exit 0
          fi
          
          # 日付がある場合は当日のダイジェスト詳細ページへ直接リンクする
          if [ -n "$DIGEST_DATE" ]; then
            HEADER="📰 *Tech Radar Daily Digest - $DIGEST_DATE*"
            if [ -n "$DIGEST_PAGE_PATH" ]; then
              TARGET_PAGE_URL="${PAGE_URL%/}/$DIGEST_PAGE_PATH"
            else
              TARGET_PAGE_URL="$PAGE_URL"
            fi
          else
            HEADER="📰 *Tech Radar* サイトが更新されました"
            TARGET_PAGE_URL="$PAGE_URL"
          fi

          PAYLOAD=$(jq -n \
            --arg header "$HEADER" \
            --arg summary "$SLACK_SUMMARY" \
            --arg page_url "$TARGET_PAGE_URL" \
            '{
              blocks: [
                {
                  type: "header",
                  text: {
                    type: "plain_text",
                    text: "Tech Radar 更新通知",
                    emoji: true
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: $header
                  }
                },
                {
                  type: "divider"
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: $summary
                  }
                },
                {
                  type: "divider"
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      text: {
                        type: "plain_text",
                        text: "📖 サイトを見る",
                        emoji: true
                      },
                      url: $page_url,
                      style: "primary"
                    }
                  ]
                }
              ]
            }')
          
          # Slack Webhook に送信
          curl --fail -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
